# CI — Phase 0B's §13 THIRTEEN BLOCKING CHECKS, numbered 0-12, cheapest first
# so failures surface fast, plus the two jobs that need a runner of their own.
#
# CI runs the SAME SCRIPTS AS A DEVELOPER, IN THE SAME ORDER (§4.3). There is
# no CI-only build command and no step that exists only in this file: a
# divergence here is how a pipeline starts proving something other than what
# developers run. Every `run:` below is a script from package.json.
#
# Phase 1 adds ONE check — `browser` — and no others. Its content validation,
# asset resolution and matrix count ride steps that already exist, because
# Phase 1 §17 says a phase must not add a check that restates one.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: '13 blocking checks'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      # Check 9 (`migrate:check`) applies migrations to real scratch databases
      # and needs a server to create them on. Checks 10 and 11 do NOT use this
      # service — they bring their own up through Testcontainers, which is what
      # a developer gets locally (§3.7).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: globalidle
          POSTGRES_PASSWORD: globalidle
          POSTGRES_DB: globalidle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globalidle -d globalidle"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # EXPORTED FOR EVERY STEP (§4.3). `prisma generate` does not connect, but
      # prisma.config.ts reads this variable EAGERLY, and a variable that is
      # unset only in CI is the classic divergence. It points at the service
      # above, so the static steps get a real URL rather than a placeholder
      # that would fail the moment something did connect.
      DATABASE_URL: postgresql://globalidle:globalidle@127.0.0.1:5432/globalidle?schema=public
      CI: '1'

    steps:
      - uses: actions/checkout@v5

      # ─────────────────────────────────────────── check 0 — toolchain and install
      #
      # Four ways for the build to stop, not four sentences in a document
      # (§3.10): engineStrict on the Node range, packageManager on the pnpm
      # version, allowBuilds on dependency install scripts, and
      # --frozen-lockfile on a lockfile that disagrees with package.json.
      - name: '0a · Node from .nvmrc'
        uses: actions/setup-node@v5
        with:
          # CI CANNOT DRIFT FROM .nvmrc, because it reads it (§3.10).
          node-version-file: .nvmrc
          # setup-node's own package-manager cache would shell out to `pnpm`
          # while resolving the store path — before Corepack has provided it,
          # because Corepack needs the Node this step is still installing.
          # Measured: "Unable to locate executable file: pnpm". The store is
          # cached explicitly below instead, keyed on the lockfile.
          package-manager-cache: false

      - name: '0b · Corepack'
        # After setup-node, never before: Corepack ships with the Node line,
        # and enabling it first would shim the runner's default Node instead of
        # the one this job runs on.
        run: corepack enable

      - name: '0c · pnpm store cache'
        uses: actions/cache@v4
        with:
          # Keyed on the lockfile, so a cold run and a warm run differ in wall
          # time only, never in outcome (§4.3).
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: '0d · Install'
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────── checks 1-3 — the cheap gates
      - name: '1 · Format check'
        run: pnpm format:check

      - name: '2 · Lint'
        run: pnpm lint

      - name: '3 · Dependency boundaries'
        run: pnpm boundaries

      # ─────────────────────────────────────────── checks 4-5 — generation and types
      - name: '4 · Prisma client generation'
        # A CHECK, not a hidden setup step: a schema that cannot generate fails
        # HERE, plainly, instead of surfacing as a confusing unresolved-module
        # error inside the typecheck (§13).
        run: pnpm generate

      - name: '5 · Typecheck — all seven workspaces'
        # `tsc -b` over the six composite projects, then apps/web's own
        # `tsc --noEmit`. Not `tsc --noEmit` at the root: project references
        # resolve against emitted declarations (§4.4). W13 proves the coverage.
        run: pnpm typecheck

      # ─────────────────────────────────────────── checks 6-7 — the fast suites
      - name: '6 · Unit tests'
        run: pnpm test:unit

      - name: '7 · Deterministic engine fixtures and Canary fidelity'
        # Fails on non-reproducible output for the same seed (E1, E2, SIM1,
        # SIM2, SIM10), on a forbidden import in the engine's module graph
        # (E3), and on authored content that has walked away from the Canary
        # import record it cites (SRC1-SRC4).
        #
        # CANARY_SOURCE is deliberately NOT set: the record is the committed
        # evidence, and CI proves the CONTENT matches it. Re-verifying the
        # record against a real checkout is a local step, documented in
        # tests/support/canary.ts.
        run: pnpm test:fixtures

      # ─────────────────────────────────────────── check 8 — content
      - name: '8 · Content validation'
        # Runs the CLI from dist, which check 5 emitted.
        run: pnpm --filter @global-idle/game-data run validate

      # ─────────────────────────────────────────── check 9 — migrations
      - name: '9a · psql for the migration check'
        # Provisioning, not a build command: migrate:check creates and drops
        # scratch databases through psql. Skipped when the runner image already
        # ships it.
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: '9b · Migration validation'
        # Applies from empty AND from the previous state, and asserts the
        # generated SQL carries every declared partial-index predicate and both
        # hand-written CHECK constraints (D1, D2, D13).
        run: pnpm --filter @global-idle/domain run migrate:check

      # ─────────────────────────────────────────── checks 10-11 — the database suites
      #
      # Testcontainers brings up PostgreSQL and Redis. The
      # GLOBAL_IDLE_TEST_* escape hatch is deliberately NOT set here: with a
      # Docker daemon present and the variables unset, the Testcontainers path
      # is the only path (tests/support/global-setup.ts).
      - name: '10 · Integration tests'
        # Includes Phase 2's ST, AU, RW, SU, DE, CX, PS, DL, GP and BL groups,
        # which drive the real domain against the real database — the custody
        # cases in particular, because a ledger that drifts is only visible
        # against a real one. PS2, PS4 and PS5 spawn a
        # SEPARATE NODE PROCESS against the same database, so restart safety is
        # proven by a restart rather than by a second connection.
        run: pnpm test:integration

      - name: '11 · Economy invariant tests'
        # A category of its own, not ordinary unit tests: currency
        # double-spend under concurrency, non-idempotent replay, ledger
        # mutation, reconciliation drift (§13) — now PER CUSTODY SCOPE, so a
        # Character's pouch cannot hide a disagreement inside its account's
        # bank (ADR-019).
        run: pnpm test:invariants

      # ─────────────────────────────────────────── check 12 — the apps build
      - name: '12 · App builds (web, api, worker)'
        # `next build` typechecks apps/web a second time.
        run: pnpm build

      # ─────────────────────────────────────────── the matrices are countable
      - name: 'Test matrices — Phase 0B 92, Phase 1 87, Phase 2 106'
        # Not a §13 check; it is how "all 92 pass", "all 87 pass" and "all 106
        # pass" stay countable claims rather than assertions (Phase 0B §14,
        # Phase 1 §16, Phase 2 §12). It fails on a missing id, a duplicate, and
        # an id belonging to no matrix — which is what keeps three id spaces
        # from colliding now that Phase 1 continues the D group at D19 and
        # Phase 2 adds a second group starting with S.
        run: node scripts/count-matrix.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  browser:
    name: 'Browser acceptance — Playwright, Chromium'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A JOB OF ITS OWN (Phase 1 §17), because it is the only one that needs a
    # browser binary. Folding it into `checks` would make every other check pay
    # for a download it has no use for.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: globalidle
          POSTGRES_PASSWORD: globalidle
          POSTGRES_DB: globalidle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globalidle -d globalidle"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://globalidle:globalidle@127.0.0.1:5432/globalidle?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      CONTENT_BUNDLE_DIR: ./packages/game-data/bundles
      API_PORT: '3001'
      LOG_LEVEL: error
      # NODE_ENV IS DELIBERATELY UNSET. `next start` sets production for its own
      # process, which is what a production build needs; setting it for the
      # whole job would make the API refuse to boot, because
      # GLOBAL_IDLE_DEV_AUTH=1 with NODE_ENV=production is the one combination
      # §3.2 turns into a crash (DEV3).
      CI: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: 'Playwright browser cache'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # KEYED ON THE LOCKFILE, so the cache follows the PINNED Playwright
          # version exactly. A hand-written version in this key would be a
          # second place to remember on every upgrade, and the one that gets
          # forgotten is the one that serves a stale browser.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 'Install Chromium only'
        # Chromium ONLY: §15's acceptance is behavioural, and three engines
        # would triple the install and the runtime for one flow.
        run: pnpm exec playwright install --with-deps chromium

      - name: 'Build'
        run: pnpm build

      - name: 'Migrate, build content, seed'
        # The same scripts `pnpm dev` runs, in the same order. The E2E stack
        # needs a migrated database and a published bundle for the same reason
        # a developer does.
        run: |
          pnpm --filter @global-idle/domain run prisma:migrate
          pnpm --filter @global-idle/game-data run build:bundle
          pnpm seed

      - name: 'Browser acceptance — E2E1-E2E10, UI1-UI8, GW1-GW8, desktop and touch'
        # Playwright starts and stops the API and the web server itself; see
        # playwright.config.ts for why it owns them rather than trusting a
        # background process to still be alive.
        run: pnpm test:e2e

      - name: 'Traces from a failed run'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  dev-bootstrap:
    name: 'Developer bootstrap — `pnpm dev` end to end'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A JOB OF ITS OWN, deliberately. It runs `docker compose up`, so it cannot
    # share a runner with the job whose PostgreSQL service already holds 5432,
    # and it is not one of §13's thirteen checks — it is §16 criterion 1's
    # orchestration half, which every other check verifies only in pieces.
    env:
      # `pnpm dev` reads the same variables a developer's .env supplies. They
      # are spelled out here because CI has no .env, and the local application
      # role's credential is what the migration deliberately does not hold.
      DATABASE_URL: postgresql://globalidle:globalidle@127.0.0.1:5432/globalidle?schema=public
      DATABASE_APP_URL: postgresql://globalidle_app:globalidle_app@127.0.0.1:5432/globalidle?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      API_PORT: '3001'
      LOG_LEVEL: info
      CONTENT_BUNDLE_DIR: ./packages/game-data/bundles
      CI: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: 'Verify the developer bootstrap'
        # Spawns the REAL `pnpm dev`, waits for every acceptance signal —
        # compose healthy, migrations applied, seed present in the database,
        # bundle built, API ready on all four conditions, web serving, worker
        # booted and its sweep registered in Redis — then tears the stack down.
        run: pnpm verify:dev
